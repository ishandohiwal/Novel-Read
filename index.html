<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NightReader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d12;
      --surface: #12151c;
      --surface-2: #191d26;
      --border: #272c38;
      --text: #f2f4f8;
      --muted: #8e96a6;
      --accent: #8b5cf6;
      --accent-light: #a78bfa;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* ---------- TOP BAR ---------- */

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 13, 18, 0.92);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.25);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }

    /* ---------- LAYOUT ---------- */

    .layout {
      display: flex;
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      width: 230px;
      flex-shrink: 0;
      padding: 28px 16px;
      border-right: 1px solid var(--border);
      background: #0e1016;
    }

    .sidebar-label {
      padding: 0 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      margin-bottom: 4px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item.active {
      color: var(--accent-light);
    }

    /* ---------- MAIN ---------- */

    .main {
      flex: 1;
      padding: 38px;
      max-width: 1500px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 36px;
    }

    .eyebrow {
      color: var(--accent-light);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 34px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
    }

    .upload-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 650;
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.2);
    }

    .upload-btn:hover {
      background: #7c3aed;
    }

    /* ---------- CONTINUE CARD ---------- */

    .section-title {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .continue-card {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 180px;
      padding: 24px;
      margin-bottom: 38px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background:
        radial-gradient(circle at 80% 30%, rgba(139, 92, 246, 0.12), transparent 35%),
        var(--surface);
    }

    .book-cover {
      width: 100px;
      height: 140px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(145deg, #30206d, #111827);
      color: #c4b5fd;
      font-size: 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .continue-info {
      flex: 1;
    }

    .continue-info h3 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .continue-info p {
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      width: min(500px, 100%);
      height: 5px;
      margin: 20px 0 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #292d38;
    }

    .progress-bar {
      width: 64%;
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #a78bfa);
    }

    .progress-text {
      color: var(--muted);
      font-size: 12px;
    }

    .read-btn {
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text);
    }

    /* ---------- LIBRARY ---------- */

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .search {
      width: 230px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 22px;
    }

    .book {
      min-width: 0;
    }

    .book-image {
      height: 215px;
      display: grid;
      place-items: center;
      margin-bottom: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(145deg, #202536, #11141b);
      color: #697386;
      font-size: 32px;
      transition: transform 0.2s ease;
    }

    .book:hover .book-image {
      transform: translateY(-4px);
    }

    .book-title {
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-author {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 750px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 18px;
      }

      .main {
        padding: 24px 18px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
      }

      .continue-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .search {
        width: 150px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">◈</div>
      <span>NightReader</span>
    </div>

    <div class="top-actions">
      <button class="icon-btn" title="Settings">⚙</button>
      <button class="icon-btn" title="Profile">●</button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-label">Library</div>

      <button class="nav-item active">
        ◫
        <span>All Books</span>
      </button>

      <button class="nav-item">
        ◉
        <span>Novels</span>
      </button>

      <button class="nav-item">
        ▣
        <span>Manga</span>
      </button>

      <button class="nav-item">
        ◇
        <span>Favorites</span>
      </button>

      <div class="sidebar-label" style="margin-top: 30px;">Other</div>

      <button class="nav-item">
        ⚙
        <span>Settings</span>
      </button>
    </aside>

    <main class="main">

      <section class="hero">
        <div>
          <div class="eyebrow">YOUR PERSONAL LIBRARY</div>
          <h1>Welcome back.</h1>
          <p class="subtitle">
            Pick up where you left off.
          </p>
        </div>

        <button class="upload-btn">
          ＋ Upload Book
        </button>
      </section>

      <h2 class="section-title">Continue Reading</h2>

      <section class="continue-card">

        <div class="book-cover">
          ◈
        </div>

        <div class="continue-info">
          <h3>Your First Book</h3>
          <p>Chapter 12 · Somewhere in the story</p>

          <div class="progress">
            <div class="progress-bar"></div>
          </div>

          <div class="progress-text">
            64% completed
          </div>
        </div>

        <button class="read-btn">
          Continue →
        </button>

      </section>

      <div class="library-header">
        <h2 class="section-title" style="margin: 0;">
          Your Library
        </h2>

        <input
          class="search"
          type="search"
          placeholder="Search books..."
        >
      </div>

      <section class="books">
      </section>

    </main>

  </div>
<script src="script.js"></script>

</body>
</html>
